<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join our WhatsApp group">
  <meta name="theme-color" content="#ffffff">
  <title>Join WhatsApp Group</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      width: min(78vw, 360px);
      height: auto;
      display: block;
      margin-bottom: 42px;
    }

    .join-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 230px;
      padding: 16px 28px;
      border-radius: 12px;
      background: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .join-btn:hover {
      background: #20bd5a;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(37, 211, 102, 0.28);
    }

    .join-btn:active {
      transform: translateY(0);
    }

    .whatsapp-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex: 0 0 auto;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .page {
        min-height: 94vh;
      }

      .logo {
        width: min(82vw, 330px);
        margin-bottom: 36px;
      }

      .join-btn {
        width: min(88vw, 320px);
        font-size: 17px;
        padding: 15px 24px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <img class="logo" src="logo.png" alt="Sabostro Proshon logo">

    <a
      class="join-btn"
      href="https://whatsapp.com/channel/0029Vb8LmDBBadmYVZh4AA3R"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Join WhatsApp group"
    >
      <svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.5 0 .16 5.34.16 11.9c0 2.1.55 4.15 1.6 5.96L.06 24l6.28-1.65a11.88 11.88 0 0 0 5.72 1.46h.01c6.55 0 11.89-5.34 11.89-11.9 0-3.18-1.24-6.17-3.44-8.43ZM12.07 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.73.98 1-3.64-.23-.37a9.87 9.87 0 0 1-1.51-5.28C2.2 6.44 6.62 2.02 12.06 2.02c2.64 0 5.12 1.03 6.98 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.42 9.89-9.86 9.89Zm5.42-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.76-1.66-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.05 1.02-1.05 2.49s1.08 2.89 1.23 3.09c.15.2 2.12 3.24 5.14 4.54.72.31 1.28.5 1.72.64.72.23 1.38.2 1.9.12.58-.09 1.76-.72 2.01-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/>
      </svg>
      Join WhatsApp
    </a>
  </main>
</body>
</html>
